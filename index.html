<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>College Navigation</title>

<style>

.container{

    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

    width:80%;

}
button{

    background:green;
    color:white;
    border:none;
    border-radius:5px;

}

}

</style>

</body>
</html>
